name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Every main commit gets its own group, since release.yml publishes the app built for the commit it drafted and a
# newer push would otherwise cancel that build while it is queued.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @codebaer/ui --fail-if-no-match exec playwright install webkit
      - run: pnpm e2e --project=webkit
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: workspace/ui/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # the tauri CLI and the frontend build that bundles into the app
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: workspace/backend }
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy --manifest-path workspace/backend/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path workspace/backend/Cargo.toml
      - run: pnpm tauri build --ci
        env:
          # the build that updates itself, see updates.rs
          CODEBAER_UPDATES: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '1' || '' }}
      - run: scripts/smoke.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test "$(uname -m)" = arm64
          bundle=workspace/backend/target/release/bundle
          app=$(basename "$bundle"/macos/*.app)
          codesign --verify --deep --strict "$bundle/macos/$app"
          mkdir "$RUNNER_TEMP/release"
          tarball="$RUNNER_TEMP/release/codebaer-macos-arm64.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$tarball" -C "$bundle/macos" "$app"
          # the updater installs this tarball only with a signature from the key in tauri.conf.json; checked here so
          # a secret from another key pair fails this push rather than the release
          pnpm tauri signer sign "$tarball"
          node scripts/updates.mjs verify "$tarball"
          cp "$bundle"/dmg/*.dmg "$RUNNER_TEMP/release/codebaer-macos-arm64.dmg"
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          # how long after its push a commit can still be released
          retention-days: 30
