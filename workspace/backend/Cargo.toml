[package]
name = "codebaer"
version = "0.5.2"
edition = "2021"
license = "MIT"

[lib]
name = "codebaer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "CodeBär"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
log = "0.4"
env_logger = "0.11"
# already in the tree as env_logger's timestamp backend; used here to date a log file
jiff = "0.2"
libc = "0.2"
portable-pty = "0.9"
tempfile = "3"
tauri-plugin-updater = "2"

